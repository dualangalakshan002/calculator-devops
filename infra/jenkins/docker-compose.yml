services:
  jenkins:
    build: .
    image: jenkins-devops:local
    container_name: jenkins
    ports:
      - "8080:8080"   # Jenkins web UI
      - "50000:50000" # Jenkins agents (used later)
    volumes:
      - jenkins_home:/var/jenkins_home            # keeps jobs, plugins, config
      - /var/run/docker.sock:/var/run/docker.sock # lets Jenkins use host Docker
    group_add:
      - "${DOCKER_GID}"                           # permission to use docker.sock
    restart: unless-stopped

volumes:
  jenkins_home: